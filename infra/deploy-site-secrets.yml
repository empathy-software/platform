
# Check if the secrets file exists (on the same node that include_vars reads from)
- name: check for secrets file
  ansible.builtin.stat:
    path: "{{ secrets_file }}"
  register: secrets_stat
  delegate_to: localhost     # keep this if secrets_file is on the controller/Jenkins node
  run_once: true

# Optional: log a friendly message when skipping
- name: secrets file missing — skipping
  ansible.builtin.debug:
    msg: "Secrets file not found at {{ secrets_file }}; skipping."
  when: not secrets_stat.stat.exists

# Do everything only when the file exists
- block:
    - name: load site secrets
      ansible.builtin.include_vars:
        file: "{{ secrets_file }}"
        name: site_secrets
      no_log: true

    - name: ensure .env exists
      ansible.builtin.file:
        path: "{{ project_dir }}/.env"
        state: touch
        mode: '0600'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: write secrets into .env
      ansible.builtin.blockinfile:
        path: "{{ project_dir }}/.env"
        marker: "# {mark} ANSIBLE MANAGED SECRETS"
        create: yes
        backup: yes
        block: |-
          {% for pair in site_secrets | dict2items | sort(attribute='key') -%}
          {{ pair.key | upper | regex_replace('[^A-Z0-9_]', '_') }}="{{ pair.value | string
            | replace('\\', '\\\\') | replace('"', '\\"') | replace('\n', '\\n') }}"
          {% endfor -%}
      no_log: true
  when: secrets_stat.stat.exists